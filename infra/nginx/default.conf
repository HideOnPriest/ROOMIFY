server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Host zachowuje port przeglądarki; przyszła obsługa forwarded headers
    # w API musi ufać wyłącznie kontrolowanemu reverse proxy.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_intercept_errors off;

    # Brak końcowego / w proxy_pass zachowuje cały prefiks /api.
    location = /api {
        proxy_pass http://api:8080;
    }

    location ^~ /api/ {
        proxy_pass http://api:8080;
    }

    location = /health {
        proxy_pass http://api:8080;
    }

    # Nowy dokument startowy powinien być pobierany po zmianie wdrożenia.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Fallback dotyczy wyłącznie tras Angulara, nigdy żądań do API.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
