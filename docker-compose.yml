name: ${COMPOSE_PROJECT_NAME:-roomify}

services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Ustaw POSTGRES_DB w .env}
      POSTGRES_USER: ${POSTGRES_USER:?Ustaw POSTGRES_USER w .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw lokalne haslo w .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 przechowuje PGDATA w /var/lib/postgresql/18/docker.
      - roomify_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - roomify

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: "8080"
      # Infrastructure składa parametry połączenia z sekcji Database bez łączenia przy starcie.
      Database__Host: db
      Database__Port: "5432"
      Database__Name: ${POSTGRES_DB:?Ustaw POSTGRES_DB w .env}
      Database__Username: ${POSTGRES_USER:?Ustaw POSTGRES_USER w .env}
      Database__Password: ${POSTGRES_PASSWORD:?Ustaw lokalne haslo w .env}
    ports:
      - "127.0.0.1:${API_PORT:-5080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/bash", "/app/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - roomify

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - roomify

networks:
  roomify:
    name: ${COMPOSE_PROJECT_NAME:-roomify}_network
    driver: bridge

volumes:
  roomify_postgres_data:
    name: roomify_postgres_data
